name: jio_hotstar_premium
description: "Jio Hotstar Premium OTT Streaming App - Foundation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  google_sign_in: ^6.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  epic_video_player: ^1.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.0
  screen_protector: ^1.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  http: ^1.2.0
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
